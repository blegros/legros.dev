{{ $imagePath := .Get 0 }} {{ $img := resources.Get $imagePath }} {{ if $img }}
{{ $resized := $img.Fill "150x150 webp" }}
<div
  role="img"
  aria-label="Brian LeGros"
  style="
    width: {{ $resized.Width }}px;
    height: {{ $resized.Height }}px;
    background-image: url('{{ $resized.RelPermalink }}');
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    margin: 0 auto 1.5rem auto;
    background-color: var(--accent-bg, #eee);
  "
></div>
{{ end }}
