<style>
  header {
    padding: 0.5rem 1rem !important;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header h1 {
    margin: 0 !important;
    font-size: 1.5rem !important;
    width: 100%;
    max-width: none !important;
    white-space: nowrap;
    padding: 0.5rem 0 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header h1::-webkit-scrollbar {
    display: none;
  }

  .terminal-box {
    display: flex;
    align-items: center;
    background-color: #111;
    color: #eee;
    font-family: var(--mono-font);
    font-size: 0.85rem;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    margin: 0 1.25rem;
    flex-grow: 0;
    border: 1px solid #333;
    line-height: 1.2;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    animation: terminal-grow 1s ease-in-out 15s forwards;
  }

  @keyframes terminal-grow {
    to { flex-grow: 1; }
  }

  .terminal-box .path { color: #39FF14; }
  .terminal-box .branch { color: #FF3131; }

  #avatar-viewport {
    display: inline-flex;
    align-items: center;
    font-family: var(--mono-font);
    flex-shrink: 0;
  }

  .avatar-state {
    display: none;
    align-items: center;
  }

  /* Default and Fallback: Neutral state */
  #avatar-viewport[data-state="neutral"] .state-neutral,
  #avatar-viewport:not([data-state]) .state-neutral {
    display: inline-flex;
  }

  /* State Switches */
  #avatar-viewport[data-state="mad"] .state-mad { display: inline-flex; }
  #avatar-viewport[data-state="happy"] .state-happy { display: inline-flex; }
  #avatar-viewport[data-state="thinking"] .state-thinking { display: inline-flex; }

  .emotion-space {
    display: inline-block;
    min-width: 1.5rem;
    text-align: center;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.2em;
    background-color: #eee;
    margin-left: 4px;
    animation: blink 1s step-end 15s infinite;
  }

  .terminal-close {
    opacity: 0;
    cursor: pointer;
    margin-left: 0.5rem;
    font-family: var(--mono-font);
    font-size: 1.25rem;
    color: #666;
    pointer-events: none;
    animation: fade-in 0.5s forwards 16s;
    flex-shrink: 0;
    user-select: none;
    display: inline-flex;
    align-items: center;
    line-height: 1;
    vertical-align: middle;
  }

  @keyframes fade-in {
    to { opacity: 1; pointer-events: auto; }
  }

  /* Reset overrides */
  .terminal-reset .terminal-box {
    animation: terminal-shrink 0.3s ease-in-out forwards !important;
  }
  .terminal-reset .cursor {
    animation: none !important;
  }
  .terminal-reset .terminal-close {
    display: none !important;
  }

  @media only screen and (max-width: 50rem) {
    .terminal-box {
      animation: terminal-shrink 0.3s ease-in-out forwards !important;
    }
    .cursor {
      animation: none !important;
    }
    .terminal-close {
      display: none !important;
    }
  }

  @keyframes terminal-shrink {
    from { flex-grow: 1; }
    to { flex-grow: 0; }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
<nav>{{- partial "nav.html" . -}}</nav>
<h1>
  <span id="avatar-viewport" data-state="neutral">
    <span class="avatar-state state-neutral">
      <span class="avatar-face">( ಠ◡ಠ)</span>
      <span class="emotion-space"></span>
    </span>
    <span class="avatar-state state-mad">
      <span class="avatar-face">( ಠ益ಠ)</span>
      <span class="emotion-space">💢</span>
    </span>
    <span class="avatar-state state-happy">
      <span class="avatar-face">( ^‿^ )</span>
      <span class="emotion-space">✨</span>
    </span>
    <span class="avatar-state state-thinking">
      <span class="avatar-face">( ಠ_ʖಠ)</span>
      <span class="emotion-space">💬</span>
    </span>
    <span class="avatar-keyboard">[⌨️]</span>
  </span>
  <span class="terminal-box">
    me@legros.dev:<span class="path">~/project</span>&nbsp;(<span class="branch">main</span>) $ <span class="cursor"></span>
  </span>
  <span class="terminal-close" onclick="resetTerminal()">X</span>
</h1>
<script>
  window.setAvatarState = function(state) {
    const viewport = document.getElementById("avatar-viewport");
    if (viewport) viewport.setAttribute("data-state", state);
  };

  window.resetTerminal = function() {
    const header = document.querySelector("header");
    if (header) {
      header.classList.add("terminal-reset");
      // Force a reflow to ensure animations stop immediately
      void header.offsetWidth;
    }
  };
</script>
