<style>
  header {
    padding: 0.5rem 1rem !important;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header h1 {
    margin: 0 !important;
    font-size: 1.5rem !important;
    width: 100%;
    max-width: none !important;
    white-space: nowrap;
    padding: 0.5rem 0 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header h1::-webkit-scrollbar {
    display: none;
  }

  .terminal-box {
    display: flex;
    align-items: center;
    gap: 1ch;
    background-color: #111;
    color: #eee;
    font-family: var(--mono-font);
    font-size: 0.85rem;
    padding: 0.2rem 0.6rem;
    border-radius: 0.25rem;
    margin: 0 1.25rem;
    flex-grow: 0;
    border: 1px solid #333;
    line-height: 1.2;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: flex-grow 0.3s ease-in-out;
  }

  .terminal-typing-area {
    display: inline-flex;
    align-items: center;
  }

  /* Initial Opening Sequence */
  header.is-opening .terminal-box {
    animation: terminal-grow 1s ease-in-out 15s forwards;
  }

  @keyframes terminal-grow {
    to { flex-grow: 1; }
  }

  .terminal-box .path { color: #39FF14; }
  .terminal-box .branch { color: #FF3131; }

  .terminal-pass {
    background-color: #4caf50;
    color: white;
    padding: 0 0.25rem;
    border-radius: 0.125rem;
    font-weight: bold;
    margin-right: 0.5rem;
    font-size: 0.75rem;
  }

  .terminal-success {
    color: #4caf50;
    font-weight: bold;
  }

  .terminal-fail {
    background-color: #f44336;
    color: white;
    padding: 0 0.25rem;
    border-radius: 0.125rem;
    font-weight: bold;
    margin-right: 0.5rem;
    font-size: 0.75rem;
  }

  .terminal-error {
    color: #f44336;
    font-weight: bold;
  }

  #avatar-viewport {
    display: inline-flex;
    align-items: center;
    font-family: var(--mono-font);
    flex-shrink: 0;
  }

  .avatar-state {
    display: none;
    align-items: center;
  }

  /* Default and Fallback: Neutral state */
  #avatar-viewport[data-state="neutral"] .state-neutral,
  #avatar-viewport:not([data-state]) .state-neutral {
    display: inline-flex;
  }

  /* State Switches */
  #avatar-viewport[data-state="mad"] .state-mad { display: inline-flex; }
  #avatar-viewport[data-state="happy"] .state-happy { display: inline-flex; }
  #avatar-viewport[data-state="thinking"] .state-thinking { display: inline-flex; }

  .avatar-face {
    display: inline-block;
    width: 6rem;
    text-align: center;
  }

  .emotion-space {
    display: inline-block;
    width: 2rem;
    text-align: center;
  }

  .cursor {
    display: none;
    width: 0.5rem;
    height: 1.2em;
    background-color: #eee;
    margin-left: 0;
  }

  .terminal-box.is-typing .cursor {
    display: inline-block;
  }

  header.is-opening .cursor {
    animation: blink 1s step-end 15s infinite;
  }

  .terminal-close {
    opacity: 0;
    cursor: pointer;
    margin-left: 0.5rem;
    font-family: var(--mono-font);
    font-size: 1.25rem;
    color: #666;
    pointer-events: none;
    flex-shrink: 0;
    user-select: none;
    display: inline-flex;
    align-items: center;
    line-height: 1;
    vertical-align: middle;
  }

  header.is-opening .terminal-close {
    animation: fade-in 0.5s forwards 16s;
  }

  @keyframes fade-in {
    to { opacity: 1; pointer-events: auto; }
  }

  /* Expanded State */
  header.is-expanded .terminal-box {
    flex-grow: 1;
    animation: none;
  }
  header.is-expanded .terminal-close {
    opacity: 1;
    pointer-events: auto;
    animation: none;
    visibility: visible;
  }
  header.is-expanded .cursor {
    animation: blink 1s step-end infinite;
  }

  /* Hidden/Closed States */
  header.is-temp-hidden .terminal-box,
  header.is-permanently-closed .terminal-box {
    flex-grow: 0 !important;
    animation: none !important;
  }
  header.is-temp-hidden .cursor,
  header.is-permanently-closed .cursor {
    animation: none !important;
  }
  header.is-temp-hidden .terminal-close,
  header.is-permanently-closed .terminal-close {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    animation: none !important;
  }

  @media only screen and (max-width: 50rem) {
    .terminal-box {
      flex-grow: 0 !important;
      animation: none !important;
    }
    .cursor {
      animation: none !important;
    }
    .terminal-close {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      animation: none !important;
    }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
<nav>{{- partial "nav.html" . -}}</nav>
<h1>
  <span id="avatar-viewport" data-state="neutral">
    <span class="avatar-state state-neutral">
      <span class="avatar-face">( ಠ◡ಠ)</span>
      <span class="emotion-space"></span>
    </span>
    <span class="avatar-state state-mad">
      <span class="avatar-face">( ಠ益ಠ)</span>
      <span class="emotion-space">💢</span>
    </span>
    <span class="avatar-state state-happy">
      <span class="avatar-face">( ^‿^ )</span>
      <span class="emotion-space">✨</span>
    </span>
    <span class="avatar-state state-thinking">
      <span class="avatar-face">( ಠ_ʖಠ)</span>
      <span class="emotion-space">💬</span>
    </span>
    <span class="avatar-keyboard">[⌨️]</span>
  </span>
  <span class="terminal-box is-typing">
    <span id="terminal-prompt">me@legros.dev:<span class="path">~/project</span>&nbsp;(<span class="branch">main</span>) $</span><span class="terminal-typing-area"><span id="terminal-content"></span><span class="cursor"></span></span>
  </span>
  <span class="terminal-close" onclick="permanentClose()">X</span>
</h1>
<script>
  (function() {
    let currentCycleId = 0;
    let isUserClosed = false;

    window.setAvatarState = function(state) {
      const viewport = document.getElementById("avatar-viewport");
      if (viewport) viewport.setAttribute("data-state", state);
    };

    function setPromptVisibility(visible) {
      const prompt = document.getElementById("terminal-prompt");
      const box = document.querySelector(".terminal-box");
      if (prompt) prompt.style.display = visible ? "inline" : "none";
      if (box) {
        if (visible) box.classList.add("is-typing");
        else box.classList.remove("is-typing");
      }
    }

    function clearTerminal() {
      const content = document.getElementById("terminal-content");
      if (content) content.innerHTML = "";
      setPromptVisibility(true);
      window.setAvatarState("neutral");
    }

    window.tempReset = function() {
      const header = document.querySelector("header");
      if (!header) return;
      currentCycleId++; // Break any existing loops
      header.classList.remove("is-opening", "is-expanded");
      header.classList.add("is-temp-hidden");
      clearTerminal();
      void header.offsetWidth;
    };

    window.permanentClose = function() {
      const header = document.querySelector("header");
      if (!header) return;
      isUserClosed = true;
      currentCycleId++;
      header.classList.remove("is-opening", "is-expanded", "is-temp-hidden");
      header.classList.add("is-permanently-closed");
      clearTerminal();
      void header.offsetWidth;
    };

    async function typeText(el, text, cycleId, speed = 80) {
      for (let i = 0; i < text.length; i++) {
        if (cycleId !== currentCycleId) return false;
        el.textContent += text[i];
        await new Promise(r => setTimeout(r, speed));
      }
      return true;
    }

    const scenes = [
      async function sceneSuccess(content, prompt, cycleId) {
        if (!await typeText(content, "npm run test", cycleId)) return;
        await new Promise(r => setTimeout(r, 1000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(false);
        content.innerHTML = '<span class="terminal-pass">PASS</span> <span class="terminal-success">✓</span> 42 tests passed';
        window.setAvatarState("happy");
        await new Promise(r => setTimeout(r, 5000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(true);
        content.innerHTML = "";
        window.setAvatarState("neutral");
      },
      async function sceneFixAndRetry(content, prompt, cycleId) {
        if (!await typeText(content, "npm run test", cycleId)) return;
        await new Promise(r => setTimeout(r, 1000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(false);
        content.innerHTML = '<span class="terminal-fail">FAIL</span> <span class="terminal-error">✕</span> 3 tests failed, 39 passed';
        window.setAvatarState("thinking");
        await new Promise(r => setTimeout(r, 3000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(true);
        content.textContent = "";
        if (!await typeText(content, "npm run test", cycleId)) return;
        await new Promise(r => setTimeout(r, 1000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(false);
        content.innerHTML = '<span class="terminal-pass">PASS</span> <span class="terminal-success">✓</span> 42 tests passed';
        window.setAvatarState("happy");
        await new Promise(r => setTimeout(r, 5000));
        if (cycleId !== currentCycleId) return;
        setPromptVisibility(true);
        content.innerHTML = "";
        window.setAvatarState("neutral");
      }
    ];

    async function startTerminalCycle() {
      const header = document.querySelector("header");
      const content = document.getElementById("terminal-content");
      const prompt = document.getElementById("terminal-prompt");
      if (!header || !content || !prompt || isUserClosed) return;

      const mql = window.matchMedia("(max-width: 50rem)");
      if (mql.matches) return;

      const cycleId = ++currentCycleId;
      header.classList.remove("is-temp-hidden", "is-expanded");
      header.classList.add("is-opening");

      // Initial wait for terminal expansion (15s delay + 2s padding)
      await new Promise(r => setTimeout(r, 17000));
      if (cycleId !== currentCycleId) return;

      header.classList.remove("is-opening");
      header.classList.add("is-expanded");

      while (cycleId === currentCycleId) {
        const scene = scenes[Math.floor(Math.random() * scenes.length)];
        await scene(content, prompt, cycleId);
        if (cycleId !== currentCycleId) break;
        await new Promise(r => setTimeout(r, 10000));
      }
    }

    // Initialize
    const mql = window.matchMedia("(max-width: 50rem)");
    mql.addEventListener("change", (e) => {
      if (e.matches) {
        window.tempReset();
      } else {
        startTerminalCycle();
      }
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => {
        if (!mql.matches) startTerminalCycle();
      });
    } else {
      if (!mql.matches) startTerminalCycle();
    }
  })();
</script>
