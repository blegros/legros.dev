<style>
  header {
    padding: 0.5rem 1rem !important;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header h1 {
    margin: 0 !important;
    font-size: 1.5rem !important;
    width: 100%;
    max-width: none !important;
    white-space: nowrap;
    padding: 0.5rem 0 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header h1::-webkit-scrollbar {
    display: none;
  }

  .terminal-box {
    display: flex;
    align-items: center;
    background-color: #111;
    color: #eee;
    font-family: var(--mono-font);
    font-size: 0.85rem;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    margin: 0 1.25rem;
    flex-grow: 0;
    border: 1px solid #333;
    line-height: 1.2;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    animation: terminal-grow 1s ease-in-out 15s forwards;
  }

  @keyframes terminal-grow {
    to { flex-grow: 1; }
  }

  .terminal-box .path { color: #39FF14; }
  .terminal-box .branch { color: #FF3131; }

  .terminal-pass {
    background-color: #4caf50;
    color: white;
    padding: 0 4px;
    border-radius: 2px;
    font-weight: bold;
    margin-right: 8px;
    font-size: 0.75rem;
  }

  .terminal-success {
    color: #4caf50;
    font-weight: bold;
  }

  .terminal-fail {
    background-color: #f44336;
    color: white;
    padding: 0 4px;
    border-radius: 2px;
    font-weight: bold;
    margin-right: 8px;
    font-size: 0.75rem;
  }

  .terminal-error {
    color: #f44336;
    font-weight: bold;
  }

  #avatar-viewport {
    display: inline-flex;
    align-items: center;
    font-family: var(--mono-font);
    flex-shrink: 0;
  }

  .avatar-state {
    display: none;
    align-items: center;
  }

  /* Default and Fallback: Neutral state */
  #avatar-viewport[data-state="neutral"] .state-neutral,
  #avatar-viewport:not([data-state]) .state-neutral {
    display: inline-flex;
  }

  /* State Switches */
  #avatar-viewport[data-state="mad"] .state-mad { display: inline-flex; }
  #avatar-viewport[data-state="happy"] .state-happy { display: inline-flex; }
  #avatar-viewport[data-state="thinking"] .state-thinking { display: inline-flex; }

  .emotion-space {
    display: inline-block;
    min-width: 1.5rem;
    text-align: center;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.2em;
    background-color: #eee;
    margin-left: 4px;
    animation: blink 1s step-end 15s infinite;
  }

  .terminal-close {
    opacity: 0;
    cursor: pointer;
    margin-left: 0.5rem;
    font-family: var(--mono-font);
    font-size: 1.25rem;
    color: #666;
    pointer-events: none;
    animation: fade-in 0.5s forwards 16s;
    flex-shrink: 0;
    user-select: none;
    display: inline-flex;
    align-items: center;
    line-height: 1;
    vertical-align: middle;
  }

  @keyframes fade-in {
    to { opacity: 1; pointer-events: auto; }
  }

  /* Reset overrides */
  .terminal-reset .terminal-box {
    animation: terminal-shrink 0.3s ease-in-out forwards !important;
  }
  .terminal-reset .cursor {
    animation: none !important;
  }
  .terminal-reset .terminal-close {
    display: none !important;
  }

  @media only screen and (max-width: 50rem) {
    .terminal-box {
      animation: terminal-shrink 0.3s ease-in-out forwards !important;
    }
    .cursor {
      animation: none !important;
    }
    .terminal-close {
      display: none !important;
    }
  }

  @keyframes terminal-shrink {
    from { flex-grow: 1; }
    to { flex-grow: 0; }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
<nav>{{- partial "nav.html" . -}}</nav>
<h1>
  <span id="avatar-viewport" data-state="neutral">
    <span class="avatar-state state-neutral">
      <span class="avatar-face">( ಠ◡ಠ)</span>
      <span class="emotion-space"></span>
    </span>
    <span class="avatar-state state-mad">
      <span class="avatar-face">( ಠ益ಠ)</span>
      <span class="emotion-space">💢</span>
    </span>
    <span class="avatar-state state-happy">
      <span class="avatar-face">( ^‿^ )</span>
      <span class="emotion-space">✨</span>
    </span>
    <span class="avatar-state state-thinking">
      <span class="avatar-face">( ಠ_ʖಠ)</span>
      <span class="emotion-space">💬</span>
    </span>
    <span class="avatar-keyboard">[⌨️]</span>
  </span>
  <span class="terminal-box">
    <span id="terminal-prompt">me@legros.dev:<span class="path">~/project</span>&nbsp;(<span class="branch">main</span>) $ </span><span id="terminal-content"></span><span class="cursor"></span>
  </span>
  <span class="terminal-close" onclick="resetTerminal()">X</span>
</h1>
<script>
  window.setAvatarState = function(state) {
    const viewport = document.getElementById("avatar-viewport");
    if (viewport) viewport.setAttribute("data-state", state);
  };

  window.resetTerminal = function() {
    const header = document.querySelector("header");
    if (header) {
      header.classList.add("terminal-reset");
      const content = document.getElementById("terminal-content");
      const prompt = document.getElementById("terminal-prompt");
      if (content) content.innerHTML = "";
      if (prompt) prompt.style.display = "inline";
      window.setAvatarState("neutral");
      // Force a reflow to ensure animations stop immediately
      void header.offsetWidth;
    }
  };

    (function() {
    async function typeText(el, text, speed = 80) {
      for (let i = 0; i < text.length; i++) {
        el.textContent += text[i];
        await new Promise(r => setTimeout(r, speed));
      }
    }

    const scenes = [
      async function sceneSuccess(content, prompt, isReset) {
        await typeText(content, "npm run test");
        if (isReset()) return;
        await new Promise(r => setTimeout(r, 1000));
        if (isReset()) return;
        prompt.style.display = "none";
        content.innerHTML = '<span class="terminal-pass">PASS</span> <span class="terminal-success">✓</span> 42 tests passed';
        window.setAvatarState("happy");
        await new Promise(r => setTimeout(r, 10000));
        if (isReset()) return;
        prompt.style.display = "inline";
        content.innerHTML = "";
        window.setAvatarState("neutral");
      },
      async function sceneFixAndRetry(content, prompt, isReset) {
        await typeText(content, "npm run test");
        if (isReset()) return;
        await new Promise(r => setTimeout(r, 1000));
        if (isReset()) return;
        prompt.style.display = "none";
        content.innerHTML = '<span class="terminal-fail">FAIL</span> <span class="terminal-error">✕</span> 3 tests failed, 39 passed';
        window.setAvatarState("thinking");
        await new Promise(r => setTimeout(r, 5000));
        if (isReset()) return;
        prompt.style.display = "inline";
        content.textContent = "";
        await typeText(content, "npm run test");
        if (isReset()) return;
        await new Promise(r => setTimeout(r, 1000));
        if (isReset()) return;
        prompt.style.display = "none";
        content.innerHTML = '<span class="terminal-pass">PASS</span> <span class="terminal-success">✓</span> 42 tests passed';
        window.setAvatarState("happy");
        await new Promise(r => setTimeout(r, 10000));
        if (isReset()) return;
        prompt.style.display = "inline";
        content.innerHTML = "";
        window.setAvatarState("neutral");
      }
    ];

    async function runSceneLoop() {
      const content = document.getElementById("terminal-content");
      const prompt = document.getElementById("terminal-prompt");
      const header = document.querySelector("header");
      if (!content || !prompt || !header) return;

      const isReset = () => header.classList.contains("terminal-reset");

      // Initial wait for terminal expansion
      await new Promise(r => setTimeout(r, 17000));

      while (!isReset()) {
        const scene = scenes[Math.floor(Math.random() * scenes.length)];
        await scene(content, prompt, isReset);
        if (isReset()) break;
        
        // Wait 10 seconds before next scene
        await new Promise(r => setTimeout(r, 10000));
      }
    }

    // Initialize loop
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runSceneLoop);
    } else {
      runSceneLoop();
    }
  })();
</script>
